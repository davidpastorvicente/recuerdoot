<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdoot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- START -->
<div id="start-screen" class="screen active">
  <div class="brand">Recuerdoot</div>
  <div class="start-subtitle">Juego de recuerdos</div>
  <div class="start-desc">Preguntas sobre vuestros audios. Adivina quién lo dijo, de qué año es... y después escucha el audio para recordar el momento.</div>
  <div class="btn-row">
    <button class="btn" onclick="initSolo()">Jugar solo</button>
    <button class="btn btn-secondary" onclick="initMultiplayer()">Multijugador</button>
  </div>
</div>

<!-- LOBBY (multiplayer only) -->
<div id="lobby" class="screen">
  <div class="brand">Recuerdoot</div>
  <div class="pin-label">PIN de la partida</div>
  <div class="pin-display" id="pin-display">------</div>
  <div class="join-url">Unirse en: <span id="join-url"></span></div>
  <canvas id="qr-canvas" style="margin:1rem auto;display:block;"></canvas>
  <div class="player-grid" id="player-grid"></div>
  <button class="btn" id="btn-lobby-start" disabled onclick="lobbyStart()">Esperando jugadores...</button>
</div>

<!-- QUESTION -->
<div id="question-screen" class="screen">
  <div class="q-header">
    <span class="q-counter" id="q-counter">1 / 22</span>
    <div class="q-progress"><div class="q-progress-fill" id="q-progress-fill"></div></div>
    <span class="q-info-right" id="q-info-right"></span>
  </div>
  <div class="q-card">
    <div class="q-badge" id="q-badge"></div>
    <img class="q-image" id="q-image" style="display:none;" alt="">
    <div class="q-text" id="q-text"></div>
    <div class="host-audio-area" id="host-audio-area" style="display:none;">
      <button class="play-btn" id="host-play-btn" onclick="toggleAudio()">
        <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
      </button>
    </div>
    <div class="countdown-container" id="countdown-container">
      <svg class="countdown-ring" width="100" height="100" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="44"/>
        <circle class="fg" id="countdown-fg" cx="50" cy="50" r="44"
          stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div class="countdown-number" id="countdown-number">15</div>
    </div>
  </div>
  <div class="option-tiles" id="option-tiles"></div>
  <div class="result-banner" id="result-banner"></div>
  <div class="reveal-info" id="reveal-info">
    <img class="reveal-image" id="reveal-image" style="display:none;" alt="">
    <button class="play-btn" id="reveal-play-btn" onclick="toggleAudio()">
      <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
      <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
    </button>
    <div class="reveal-label" id="reveal-label"></div>
  </div>
  <button class="btn" id="btn-next" style="display:none;" onclick="nextQuestion()">Siguiente</button>
</div>

<!-- REVEAL (multiplayer only) -->
<div id="reveal-screen" class="screen">
  <div class="q-card" style="margin-bottom:16px;">
    <div class="q-badge" id="r-badge"></div>
    <div class="q-text" id="r-text"></div>
  </div>
  <div class="bar-chart" id="r-bar-chart"></div>
  <div class="reveal-info" id="r-reveal-info">
    <img class="reveal-image" id="r-reveal-image" style="display:none;" alt="">
    <button class="play-btn" id="r-reveal-play-btn" onclick="toggleAudio()">
      <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
      <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
    </button>
    <div class="reveal-label" id="r-reveal-label"></div>
  </div>
  <div class="leaderboard" id="r-leaderboard"></div>
  <button class="btn" id="btn-mp-next" onclick="mpNext()">Siguiente</button>
</div>

<!-- END (solo) -->
<div id="end-solo" class="screen">
  <div class="brand">Recuerdoot</div>
  <h1 style="font-size:2.2rem;font-weight:800;margin-bottom:12px;">Fin del juego</h1>
  <div class="final-score" id="final-score"></div>
  <div class="end-msg" id="end-message"></div>
  <button class="btn" onclick="initSolo()">Jugar otra vez</button>
  <button class="btn btn-secondary" style="margin-top:12px;" onclick="backToStart()">Volver</button>
</div>

<!-- END (multiplayer) -->
<div id="end-mp" class="screen">
  <div class="brand">Recuerdoot</div>
  <div class="trophy">&#127942;</div>
  <div class="winner-name" id="winner-name"></div>
  <div class="winner-score" id="winner-score"></div>
  <div class="leaderboard" id="end-leaderboard"></div>
  <button class="btn" style="margin-top:24px;" onclick="backToStart()">Nueva partida</button>
</div>

<audio id="game-audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
