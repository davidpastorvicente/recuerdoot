<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdoot</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div id="start-countdown-overlay" aria-live="assertive" aria-atomic="true">
  <div id="start-countdown-inner">
    <div id="start-countdown-label">Preparados</div>
    <div id="start-countdown-number" aria-hidden="true">
      <span class="start-countdown-digit active"></span>
      <span class="start-countdown-digit"></span>
    </div>
  </div>
</div>

<!-- START -->
<div id="start-screen" class="screen active">
  <div class="brand">Recuerdoot</div>
  <div id="start-subtitle">Juego de recuerdos</div>
  <div id="start-description">Preguntas sobre vuestros recuerdos con audios e imágenes. Adivina la respuesta correcta y descubre después el momento completo.</div>
  <div class="button-row">
    <button class="button" id="start-solo-button">Jugar solo</button>
    <button class="button button-secondary" id="start-multiplayer-button">Multijugador</button>
  </div>
</div>

<!-- LOBBY (multiplayer only) -->
<div id="lobby" class="screen">
  <div class="brand">Recuerdoot</div>
  <div id="pin-label">PIN de la partida</div>
  <div id="pin-display"></div>
  <div id="join-url-container">Unirse en: <a id="join-url" target="_blank" rel="noopener"></a></div>
  <canvas id="qr-canvas" style="margin:1rem auto;display:block;"></canvas>
  <div id="player-grid"></div>
  <button class="button" id="lobby-start-button" disabled>Esperando jugadores...</button>
</div>

<!-- QUESTION -->
<div id="question-screen" class="screen">
  <div class="question-top">
    <span class="question-info" id="question-counter"></span>
    <div class="question-card">
      <div class="question-text" id="question-text"></div>
    </div>
  </div>
  <div id="question-body">
    <div id="countdown-container">
      <svg id="countdown-ring" width="100" height="100" viewBox="0 0 100 100">
        <circle id="countdown-ring-track" cx="50" cy="50" r="44"/>
        <circle id="countdown-ring-progress" cx="50" cy="50" r="44"
          stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div id="countdown-number"></div>
    </div>
    <div id="question-media">
      <img id="question-image" style="display:none;" alt="Imagen de la pregunta">
      <video id="question-video" style="display:none;" playsinline preload="metadata" controls aria-label="Video de la pregunta"></video>
      <div id="host-audio-area" style="display:none;">
        <button class="play-button" id="host-play-button" aria-label="Reproducir o pausar audio de la pregunta">
          <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
          <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
        </button>
      </div>
    </div>
    <div id="answer-count">
      <span id="answer-count-number"></span>
      <span id="answer-count-label">Respuestas</span>
    </div>
  </div>
  <div id="stage-answer-grid"></div>
  <div id="question-feedback-area">
    <div id="result-modal">
      <div id="result-modal-content">
        <div id="result-modal-status"></div>
        <div id="result-modal-detail"></div>
        <div id="result-modal-media">
          <img class="reveal-image" id="reveal-image" style="display:none;" alt="Imagen revelada tras responder">
          <video class="reveal-image" id="reveal-video" style="display:none;" playsinline preload="metadata" controls aria-label="Video revelado tras responder"></video>
          <div id="result-modal-audio-row" style="display:none;">
            <button class="play-button" id="reveal-play-button" aria-label="Reproducir o pausar audio revelado">
              <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
              <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
            </button>
            <div class="reveal-label" id="reveal-label"></div>
          </div>
        </div>
        <button class="button" id="solo-next-button">Siguiente</button>
      </div>
    </div>
  </div>
</div>

<!-- REVEAL (multiplayer only) -->
<div id="reveal-screen" class="screen">
  <div class="question-top">
    <div class="question-info" id="reveal-question-meta"></div>
    <div class="question-card">
      <div class="question-text" id="reveal-text"></div>
    </div>
  </div>
  <div id="reveal-body">
    <div id="reveal-media">
      <img class="reveal-image" id="reveal-media-image" style="display:none;" alt="Imagen revelada de la pregunta">
      <video class="reveal-image" id="reveal-media-video" style="display:none;" playsinline preload="metadata" controls aria-label="Video revelado de la pregunta"></video>
      <button class="play-button" id="reveal-media-play-button" aria-label="Reproducir o pausar audio revelado">
        <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
      </button>
      <div class="reveal-label" id="reveal-media-label"></div>
    </div>
    <div id="reveal-chart"></div>
  </div>
  <button class="button" id="reveal-next-button">Siguiente</button>
</div>

<!-- SCOREBOARD (multiplayer only) -->
<div id="scoreboard-screen" class="screen">
  <div class="question-card scoreboard-card">
    <div class="question-text" id="scoreboard-title">Marcador</div>
  </div>
  <div class="leaderboard" id="scoreboard-leaderboard"></div>
  <button class="button" id="scoreboard-next-button">Siguiente</button>
</div>

<!-- END (solo) -->
<div id="solo-end-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <h1 style="font-size:2.2rem;font-weight:800;margin-bottom:12px;">Fin del juego</h1>
  <div id="final-score"></div>
  <div id="end-message"></div>
  <button class="button" id="solo-restart-button">Jugar otra vez</button>
  <button class="button button-secondary" id="solo-back-button" style="margin-top:12px;">Volver</button>
</div>

<!-- END (multiplayer) -->
<div id="multiplayer-end-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div id="trophy" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64" role="img" focusable="false">
      <path fill="currentColor" d="M20 8h24v8h8c0 8.8-5.2 16.1-12 18.7V42h6a4 4 0 0 1 4 4v2H14v-2a4 4 0 0 1 4-4h6v-7.3C17.2 32.1 12 24.8 12 16h8V8Zm-2 12c0 4.9 2.6 9.1 6.5 11.4A19.8 19.8 0 0 1 20 20h-2Zm28 0c0 4.1-1.6 8-4.5 11.4C45.4 29.1 48 24.9 48 20h-2Z"/>
    </svg>
  </div>
  <div id="winner-name"></div>
  <div id="winner-score"></div>
  <div class="leaderboard" id="end-leaderboard"></div>
  <button class="button" id="multiplayer-back-button" style="margin-top:24px;">Nueva partida</button>
</div>

<audio id="game-audio"></audio>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/js/host.js"></script>
</body>
</html>
