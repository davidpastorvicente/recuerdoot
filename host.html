<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdoot - Host</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f13; --surface: #1a1a24; --surface-hover: #24243a;
    --border: #2a2a3e; --text: #e8e8f0; --text-secondary: #8888a8;
    --accent: #7c5cfc; --accent-glow: rgba(124,92,252,0.25);
    --correct: #34d399; --correct-bg: rgba(52,211,153,0.15);
    --wrong: #f87171; --wrong-bg: rgba(248,113,113,0.15);
    --opt0: #e74c3c; --opt1: #3498db; --opt2: #f1c40f; --opt3: #2ecc71;
  }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px; overflow: hidden;
  }
  .screen { display: none; width: 100%; max-width: 900px; text-align: center; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* Brand */
  .brand { font-size: 3.2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 8px;
    background: linear-gradient(135deg, #faf7ff 0%, #b48cff 45%, #7c5cfc 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* Lobby */
  .pin-display { font-size: 5rem; font-weight: 900; letter-spacing: 0.15em; color: var(--accent);
    text-shadow: 0 0 40px var(--accent-glow); margin: 16px 0; }
  .pin-label { font-size: 1.1rem; color: var(--text-secondary); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; }
  .join-url { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 32px; }
  .join-url span { color: var(--text); font-weight: 600; }
  .player-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    margin: 24px 0; min-height: 60px; }
  .player-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 24px; font-weight: 700; font-size: 1.1rem;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .btn { background: var(--accent); color: white; border: none; padding: 18px 56px;
    border-radius: 14px; font-size: 1.2rem; font-weight: 700; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s; }
  .btn:hover { transform: scale(1.04); box-shadow: 0 0 30px var(--accent-glow); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* Question screen */
  .q-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .q-counter { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .q-progress { flex: 1; height: 6px; background: var(--border); border-radius: 3px; margin: 0 20px; overflow: hidden; }
  .q-progress-fill { height: 100%; background: linear-gradient(90deg, #7c5cfc, #c084fc); border-radius: 3px; transition: width 0.4s; }
  .q-answers-count { font-size: 0.9rem; font-weight: 600; color: var(--accent); }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px; width: 100%; margin-bottom: 24px; }
  .q-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--accent); background: var(--accent-glow);
    padding: 6px 16px; border-radius: 20px; margin-bottom: 16px; }
  .q-text { font-size: 1.6rem; font-weight: 700; line-height: 1.5; }
  .q-text .quote { color: var(--correct); font-style: italic; }

  /* Countdown ring */
  .countdown-container { position: relative; margin: 20px auto; width: 100px; height: 100px; }
  .countdown-ring { transform: rotate(-90deg); }
  .countdown-ring circle { fill: none; stroke-width: 6; }
  .countdown-ring .bg { stroke: var(--border); }
  .countdown-ring .fg { stroke: var(--accent); stroke-linecap: round;
    transition: stroke-dashoffset 1s linear; }
  .countdown-number { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 2.4rem; font-weight: 900; color: var(--accent); }

  /* Audio play in host */
  .host-audio-area { margin: 16px 0; }
  .play-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); border: none;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s; }
  .play-btn:hover { transform: scale(1.08); box-shadow: 0 0 30px var(--accent-glow); }
  .play-btn .icon-play, .play-btn .icon-pause { fill: white; }
  .play-btn .icon-pause { display: none; }
  .play-btn.playing .icon-play { display: none; }
  .play-btn.playing .icon-pause { display: block; }

  /* Option tiles (Kahoot-style colored blocks) */
  .option-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
  .option-tile { border-radius: 14px; padding: 24px 16px; font-size: 1.25rem; font-weight: 700;
    color: white; display: flex; align-items: center; gap: 14px; text-align: left;
    transition: all 0.3s; opacity: 1; }
  .option-tile .shape { width: 32px; height: 32px; flex-shrink: 0; }
  .option-tile:nth-child(1) { background: var(--opt0); }
  .option-tile:nth-child(2) { background: var(--opt1); }
  .option-tile:nth-child(3) { background: var(--opt2); color: #1a1a24; }
  .option-tile:nth-child(4) { background: var(--opt3); }
  /* Reveal states */
  .option-tile.dim { opacity: 0.25; transform: scale(0.95); }
  .option-tile.correct-tile { opacity: 1; transform: scale(1.05);
    box-shadow: 0 0 30px rgba(52,211,153,0.4); }
  .option-tile .count-badge { margin-left: auto; background: rgba(0,0,0,0.25);
    padding: 6px 14px; border-radius: 20px; font-size: 1rem; }

  /* Reveal info */
  .reveal-info { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 28px; margin: 16px 0; display: flex; align-items: center; gap: 20px; }
  .reveal-label { text-align: left; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5; }
  .reveal-label strong { color: var(--text); }

  /* Bar chart (Kahoot-style reveal) */
  .bar-chart { display: flex; align-items: flex-end; justify-content: center; gap: 16px;
    width: 100%; height: 220px; margin-bottom: 24px; padding: 0 16px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 160px; height: 100%; justify-content: flex-end; }
  .bar-fill { width: 100%; border-radius: 8px 8px 0 0; transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative; min-height: 0; margin-bottom: -1px; }
  .bar-fill.c0 { background: var(--opt0); } .bar-fill.c1 { background: var(--opt1); }
  .bar-fill.c2 { background: var(--opt2); } .bar-fill.c3 { background: var(--opt3); }
  .bar-fill.dim-bar { opacity: 0.2; }
  .bar-count { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 6px; }
  .bar-check { margin-bottom: 4px; font-size: 1.4rem; min-height: 1.6em; }
  .bar-base { width: 100%; padding: 10px 8px; border-radius: 0 0 8px 8px; display: flex;
    align-items: center; justify-content: center; gap: 8px; color: white; font-weight: 700;
    font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-base.c0 { background: var(--opt0); } .bar-base.c1 { background: var(--opt1); }
  .bar-base.c2 { background: var(--opt2); color: #1a1a24; } .bar-base.c3 { background: var(--opt3); }

  /* Leaderboard */
  .leaderboard { width: 100%; max-width: 600px; margin: 24px auto; }
  .lb-row { display: flex; align-items: center; padding: 16px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
    animation: slideIn 0.4s ease both; }
  .lb-row:nth-child(1) { border-color: #ffd700; }
  .lb-row:nth-child(2) { border-color: #c0c0c0; }
  .lb-row:nth-child(3) { border-color: #cd7f32; }
  @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .lb-rank { font-size: 1.5rem; font-weight: 900; width: 48px; color: var(--accent); }
  .lb-name { flex: 1; font-weight: 700; font-size: 1.15rem; text-align: left; }
  .lb-score { font-weight: 800; font-size: 1.2rem; color: var(--accent); }

  /* End screen */
  .trophy { font-size: 5rem; margin-bottom: 16px; }
  .winner-name { font-size: 2.8rem; font-weight: 900;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .winner-score { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 32px; }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby" class="screen active">
  <div class="brand">Recuerdoot</div>
  <div class="pin-label">PIN de la partida</div>
  <div class="pin-display" id="pin-display">------</div>
  <div class="join-url">Unirse en: <span id="join-url"></span></div>
  <div class="player-grid" id="player-grid"></div>
  <button class="btn" id="btn-start" disabled onclick="startGame()">Esperando jugadores...</button>
</div>

<!-- QUESTION -->
<div id="question-screen" class="screen">
  <div class="q-header">
    <span class="q-counter" id="q-counter">1 / 22</span>
    <div class="q-progress"><div class="q-progress-fill" id="q-progress-fill"></div></div>
    <span class="q-answers-count" id="q-answers-count">0 respuestas</span>
  </div>
  <div class="q-card">
    <div class="q-badge" id="q-badge"></div>
    <div class="q-text" id="q-text"></div>
    <div class="host-audio-area" id="host-audio-area" style="display:none;">
      <button class="play-btn" id="host-play-btn" onclick="toggleHostAudio()">
        <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
      </button>
    </div>
    <div class="countdown-container" id="countdown-container">
      <svg class="countdown-ring" width="100" height="100" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="44"/>
        <circle class="fg" id="countdown-fg" cx="50" cy="50" r="44"
          stroke-dasharray="276.46" stroke-dashoffset="0"/>
      </svg>
      <div class="countdown-number" id="countdown-number">15</div>
    </div>
  </div>
  <div class="option-tiles" id="option-tiles"></div>
</div>

<!-- REVEAL -->
<div id="reveal-screen" class="screen">
  <div class="q-card" style="margin-bottom:16px;">
    <div class="q-badge" id="r-badge"></div>
    <div class="q-text" id="r-text"></div>
  </div>
  <div class="bar-chart" id="r-bar-chart"></div>
  <div class="reveal-info" id="reveal-info" style="display:none;">
    <button class="play-btn" id="reveal-play-btn" onclick="toggleRevealAudio()">
      <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
      <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>
    </button>
    <div class="reveal-label" id="reveal-label"></div>
  </div>
  <div class="leaderboard" id="r-leaderboard"></div>
  <button class="btn" id="btn-next" onclick="hostNext()">Siguiente</button>
</div>

<!-- END -->
<div id="end-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div class="trophy">&#127942;</div>
  <div class="winner-name" id="winner-name"></div>
  <div class="winner-score" id="winner-score"></div>
  <div class="leaderboard" id="end-leaderboard"></div>
  <button class="btn" style="margin-top:24px;" onclick="location.reload()">Nueva partida</button>
</div>

<audio id="host-audio"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const audio = document.getElementById("host-audio");
let isPlaying = false;
let countdownInterval = null;
let currentQData = null;

const shapes = [
  `<svg viewBox="0 0 32 32" width="32" height="32"><polygon points="16,2 2,30 30,30" fill="white"/></svg>`,
  `<svg viewBox="0 0 32 32" width="32" height="32"><rect x="2" y="2" width="28" height="28" rx="4" fill="white"/></svg>`,
  `<svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="14" fill="white"/></svg>`,
  `<svg viewBox="0 0 32 32" width="32" height="32"><polygon points="16,2 30,16 16,30 2,16" fill="white"/></svg>`,
];

// Create game on load
socket.emit("host:create");

socket.on("host:created", ({ pin }) => {
  document.getElementById("pin-display").textContent = pin;
  document.getElementById("join-url").textContent = `${location.host}/player.html`;
});

socket.on("host:playerList", (players) => {
  const grid = document.getElementById("player-grid");
  grid.innerHTML = players.map(p => `<div class="player-chip">${p.name}</div>`).join("");
  const btn = document.getElementById("btn-start");
  btn.disabled = players.length === 0;
  btn.textContent = players.length > 0 ? `Empezar (${players.length} jugador${players.length > 1 ? 'es' : ''})` : "Esperando jugadores...";
});

function startGame() {
  socket.emit("host:start");
}

socket.on("host:question", (data) => {
  currentQData = data;
  showScreen("question-screen");

  document.getElementById("q-counter").textContent = `${data.index + 1} / ${data.total}`;
  document.getElementById("q-progress-fill").style.width = `${((data.index + 1) / data.total) * 100}%`;
  document.getElementById("q-answers-count").textContent = "0 respuestas";
  document.getElementById("q-badge").textContent = data.badge;

  // Render question text with quote styling
  const qText = document.getElementById("q-text");
  const quoteMatch = data.question.match(/"([^"]+)"/);
  if (quoteMatch) {
    qText.innerHTML = data.question.replace(`"${quoteMatch[1]}"`, `<span class="quote">"${quoteMatch[1]}"</span>`);
  } else {
    qText.textContent = data.question;
  }

  // Audio
  const audioArea = document.getElementById("host-audio-area");
  if (data.audioBefore) {
    audioArea.style.display = "";
    audio.src = data.audioSrc;
    audio.load();
    isPlaying = false;
    document.getElementById("host-play-btn").classList.remove("playing");
  } else {
    audioArea.style.display = "none";
  }

  // Options (hidden during pre-phase for audioBefore)
  const tiles = document.getElementById("option-tiles");
  tiles.innerHTML = data.options.map((opt, i) =>
    `<div class="option-tile" style="${data.audioBefore ? 'opacity:0.15' : ''}"><span class="shape">${shapes[i]}</span>${opt}</div>`
  ).join("");

  if (data.audioBefore) {
    // Show countdown circle paused (showing 5)
    document.getElementById("countdown-container").style.display = "";
    document.getElementById("countdown-number").textContent = "5";
    document.getElementById("countdown-number").style.color = "var(--accent)";
    const fg = document.getElementById("countdown-fg");
    fg.style.transition = "none";
    fg.style.strokeDashoffset = "0";
    document.getElementById("q-answers-count").textContent = "Escuchad...";

    // Phase 1: 5s to read the question
    setTimeout(() => {
      // Phase 2: auto-play audio
      audio.play();
      isPlaying = true;
      document.getElementById("host-play-btn").classList.add("playing");
      audio.onended = () => {
        isPlaying = false;
        document.getElementById("host-play-btn").classList.remove("playing");
        // Phase 3: countdown starts immediately, 5s to answer
        document.getElementById("q-answers-count").textContent = "0 respuestas";
        tiles.querySelectorAll(".option-tile").forEach(t => t.style.opacity = "");
        startCountdown(5);
        socket.emit("host:answersOpen");
      };
    }, 3000);
  } else {
    // No audio before: countdown starts immediately
    document.getElementById("countdown-container").style.display = "";
    startCountdown(data.countdown);
  }
});

socket.on("host:answerCount", ({ answered, total }) => {
  document.getElementById("q-answers-count").textContent = `${answered} / ${total} respuestas`;
});

socket.on("host:reveal", (data) => {
  clearInterval(countdownInterval);
  audio.pause();
  isPlaying = false;

  showScreen("reveal-screen");
  document.getElementById("r-badge").textContent = currentQData.badge;

  const rText = document.getElementById("r-text");
  const quoteMatch = currentQData.question.match(/"([^"]+)"/);
  if (quoteMatch) {
    rText.innerHTML = currentQData.question.replace(`"${quoteMatch[1]}"`, `<span class="quote">"${quoteMatch[1]}"</span>`);
  } else {
    rText.textContent = currentQData.question;
  }

  // Bar chart
  const maxCount = Math.max(1, ...currentQData.options.map(o => data.optionCounts[o] || 0));
  const chart = document.getElementById("r-bar-chart");
  chart.innerHTML = currentQData.options.map((opt, i) => {
    const count = data.optionCounts[opt] || 0;
    const isCorrect = opt === data.correct;
    const heightPct = count > 0 ? Math.max(10, (count / maxCount) * 100) : 4;
    const dimCls = isCorrect ? "" : "dim-bar";
    const check = isCorrect ? "\u2714" : "";
    return `<div class="bar-col">
      <div class="bar-check">${check}</div>
      <div class="bar-count">${count}</div>
      <div class="bar-fill c${i} ${dimCls}" style="height:${heightPct}%"></div>
      <div class="bar-base c${i}">${shapes[i]} ${opt}</div>
    </div>`;
  }).join("");

  // Reveal original audio
  const revealInfo = document.getElementById("reveal-info");
  if (data.showOriginal || !currentQData.audioBefore) {
    revealInfo.style.display = "flex";
    audio.src = data.originalAudio;
    audio.load();
    isPlaying = false;
    document.getElementById("reveal-play-btn").classList.remove("playing");
    document.getElementById("reveal-label").innerHTML = `<strong>${data.person}</strong><br>${data.date}`;
  } else {
    revealInfo.style.display = "none";
  }

  // Leaderboard
  renderLeaderboard("r-leaderboard", data.leaderboard);

  // Last question?
  document.getElementById("btn-next").textContent =
    currentQData.index < currentQData.total - 1 ? "Siguiente" : "Ver resultados";
});

socket.on("game:end", ({ leaderboard }) => {
  clearInterval(countdownInterval);
  audio.pause();
  showScreen("end-screen");
  if (leaderboard.length > 0) {
    document.getElementById("winner-name").textContent = leaderboard[0].name;
    document.getElementById("winner-score").textContent = `${leaderboard[0].score} puntos`;
  }
  renderLeaderboard("end-leaderboard", leaderboard);
});

function hostNext() {
  audio.pause();
  isPlaying = false;
  socket.emit("host:next");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startCountdown(seconds) {
  let remaining = seconds;
  const circumference = 2 * Math.PI * 44; // ~276.46
  const fg = document.getElementById("countdown-fg");
  const num = document.getElementById("countdown-number");

  fg.style.transition = "none";
  fg.style.strokeDashoffset = "0";
  num.textContent = remaining;

  // Force reflow
  fg.getBoundingClientRect();
  fg.style.transition = "stroke-dashoffset 1s linear";

  countdownInterval = setInterval(() => {
    remaining--;
    if (remaining < 0) { clearInterval(countdownInterval); socket.emit("host:timeUp"); return; }
    num.textContent = remaining;
    const offset = circumference * (1 - remaining / seconds);
    fg.style.strokeDashoffset = offset;
    if (remaining <= 5) num.style.color = "var(--wrong)";
    else num.style.color = "var(--accent)";
  }, 1000);
}

function toggleHostAudio() {
  if (isPlaying) {
    audio.pause(); isPlaying = false;
    document.getElementById("host-play-btn").classList.remove("playing");
  } else {
    audio.play(); isPlaying = true;
    document.getElementById("host-play-btn").classList.add("playing");
  }
}

function toggleRevealAudio() {
  if (isPlaying) {
    audio.pause(); isPlaying = false;
    document.getElementById("reveal-play-btn").classList.remove("playing");
  } else {
    audio.play(); isPlaying = true;
    document.getElementById("reveal-play-btn").classList.add("playing");
  }
}
audio.addEventListener("ended", () => {
  isPlaying = false;
  document.getElementById("host-play-btn").classList.remove("playing");
  document.getElementById("reveal-play-btn").classList.remove("playing");
});

function renderLeaderboard(containerId, list) {
  const el = document.getElementById(containerId);
  el.innerHTML = list.map((p, i) =>
    `<div class="lb-row" style="animation-delay:${i * 0.08}s">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-name">${p.name}</span>
      <span class="lb-score">${p.score}</span>
    </div>`
  ).join("");
}
</script>
</body>
</html>
