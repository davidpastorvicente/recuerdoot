<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdoot - Jugar</title>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="player">

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="brand">Recuerdoot</div>
  <div id="join-form">
    <div class="input-group">
      <label for="pin-input">PIN de la partida</label>
      <input type="tel" id="pin-input" placeholder="000000" maxlength="6" inputmode="numeric">
    </div>
    <div class="input-group">
      <label for="name-input">Tu nombre</label>
      <input type="text" id="name-input" placeholder="Nombre" maxlength="15">
    </div>
    <button class="btn" id="join-button">Unirse</button>
    <div id="error-msg" role="alert" aria-live="polite"></div>
  </div>
</div>

<!-- WAITING IN LOBBY -->
<div id="waiting-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div id="my-name"></div>
  <div class="waiting-text pulse">Esperando a que el host empiece...</div>
</div>

<!-- ANSWERING -->
<div id="answer-screen" class="screen">
  <div class="question-info" id="player-question-meta">Pregunta 1 / 22</div>
  <div id="player-answer-grid"></div>
</div>

<!-- LISTENING (pre-phase for audio questions) -->
<div id="listen-screen" class="screen">
  <div class="question-info" id="listen-question-meta">Pregunta 1 / 22</div>
  <div id="listen-icon" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64" role="img" focusable="false">
      <path fill="currentColor" d="M22 18a10 10 0 0 1 20 0v4h2a8 8 0 0 1 8 8v10a8 8 0 0 1-8 8h-2v2a10 10 0 0 1-20 0v-2h-2a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8h2v-4Zm6 0v30a4 4 0 0 0 8 0V18a4 4 0 0 0-8 0Z"/>
    </svg>
  </div>
  <div class="waiting-text pulse">Mira la pantalla y escucha...</div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div id="result-icon" aria-hidden="true"></div>
  <div class="result-text" id="result-text"></div>
  <div id="result-points"></div>
  <div id="result-score"></div>
  <div id="result-streak"></div>
  <div class="waiting-text pulse" style="margin-top:24px;">Esperando siguiente pregunta...</div>
</div>

<!-- GAME OVER -->
<div id="end-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div id="end-rank"></div>
  <div class="result-text" id="end-position"></div>
  <div id="end-score"></div>
  <button class="btn" id="player-reload-button" style="margin-top:32px;">Volver</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="assets/js/player.js"></script>
</body>
</html>
