<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Recuerdoot · Jugar</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/main.css">
<script src="assets/js/i18n.js"></script>
<script src="assets/js/ui-shell.js"></script>
</head>
<body class="page-player" data-i18n-title="page.playerTitle" data-state="join">

<div class="dot-grid" aria-hidden="true"></div>

<div id="start-countdown-overlay" class="countdown-overlay" aria-live="assertive" aria-atomic="true" aria-hidden="true">
  <div class="countdown-overlay-inner">
    <div id="start-countdown-label" class="overline"></div>
    <div id="start-countdown-number" aria-hidden="true">
      <span class="start-countdown-digit active"></span>
      <span class="start-countdown-digit"></span>
    </div>
  </div>
</div>

<header class="app-nav">
  <div class="nav-start">
    <img class="brand-mark" src="assets/favicon.svg" alt="" width="24" height="24">
    <span class="brand"></span>
  </div>
  <div class="nav-end">
    <output class="chip chip-warning" id="connection-chip" hidden><span class="status-dot status-pending"></span><span data-i18n="player.reconnecting">Reconectando…</span></output>
    <span class="chip" id="player-name-chip" hidden></span>
    <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-aria-label="lang.label">
      <button type="button" class="lang-option" data-locale-option="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
      <button type="button" class="lang-option" data-locale-option="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="app-main">

  <!-- JOIN -->
  <section id="join-screen" class="screen screen-phone" aria-labelledby="join-title">
    <div class="phone-stack">
      <p class="overline" data-i18n="player.overline">Únete a la partida</p>
      <h1 class="headline" id="join-title" data-i18n="player.title">¿Listo para recordar?</h1>
      <form id="join-form" class="card form-card" novalidate>
        <div class="field">
          <label class="field-label" for="pin-input" data-i18n="lobby.pinLabel">PIN de la partida</label>
          <input class="input input-pin mono" id="pin-input" name="pin" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
        </div>
        <div class="field">
          <label class="field-label" for="name-input" data-i18n="player.nameLabel">Tu nombre</label>
          <input class="input" id="name-input" name="name" type="text" autocomplete="given-name" enterkeyhint="go" maxlength="15" placeholder="Nombre" data-i18n-placeholder="player.namePlaceholder" required>
        </div>
        <button type="submit" class="button button-primary button-lg button-block" id="join-button" data-i18n="player.join">Unirse</button>
        <p id="error-msg" class="field-error" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- WAITING IN LOBBY -->
  <section id="waiting-screen" class="screen screen-phone" aria-labelledby="my-name" hidden>
    <div class="phone-stack phone-stack-center">
      <p class="overline" data-i18n="player.inside">Estás dentro</p>
      <h1 class="headline" id="my-name">Jugador</h1>
      <span class="chip"><span class="status-dot status-live"></span><span data-i18n="player.waitingStart">Esperando a que empiece la partida</span></span>
    </div>
  </section>

  <!-- ANSWERING -->
  <section id="answer-screen" class="screen screen-phone screen-answer" aria-labelledby="answer-question-meta" hidden>
    <div class="answer-header">
      <span class="overline" id="answer-question-meta"></span>
      <span class="chip chip-status" id="answer-status" aria-live="polite"></span>
    </div>
    <div id="player-answer-grid" class="player-answer-grid"></div>
  </section>

  <!-- RESULT -->
  <section id="result-screen" class="screen screen-phone" aria-labelledby="result-text" hidden>
    <div class="phone-stack phone-stack-center">
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <h1 class="headline" id="result-text">Resultado</h1>
      <p class="result-points mono" id="result-points"></p>
      <div class="card result-card">
        <div class="result-stat">
          <span class="overline" data-i18n="player.rank">Posición</span>
          <span id="result-rank" class="result-rank"></span>
        </div>
        <div class="result-stat">
          <span class="overline" data-i18n="player.points">Puntos</span>
          <span id="result-score" class="result-score mono"></span>
        </div>
      </div>
      <p id="result-position" class="muted"></p>
      <span id="result-streak" class="chip chip-success" hidden></span>
      <span class="chip"><span class="status-dot status-live"></span><span data-i18n="player.waitingNext">Esperando la siguiente pregunta</span></span>
    </div>
  </section>

  <!-- GAME OVER -->
  <section id="end-screen" class="screen screen-phone" aria-labelledby="end-position" hidden>
    <div class="phone-stack phone-stack-center">
      <p class="overline" data-i18n="player.gameOver">Fin de la partida</p>
      <div id="end-rank" class="end-rank"></div>
      <h1 class="headline" id="end-position">Fin de la partida</h1>
      <p class="muted mono" id="end-score"></p>
      <button type="button" class="button button-primary button-lg button-block" id="player-reload-button" data-i18n="player.back">Volver</button>
    </div>
  </section>

</main>

<script src="assets/vendor/peerjs.min.js"></script>
<script src="assets/js/game-config.js"></script>
<script src="assets/js/state-machines.js"></script>
<script src="assets/js/game-shared.js"></script>
<script src="assets/js/peer-transport.js"></script>
<script src="assets/js/player.js"></script>
</body>
</html>
