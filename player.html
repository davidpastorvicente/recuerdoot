<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Recuerdoot - Jugar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f0f13; --surface: #1a1a24; --surface-hover: #24243a;
    --border: #2a2a3e; --text: #e8e8f0; --text-secondary: #8888a8;
    --accent: #7c5cfc; --accent-glow: rgba(124,92,252,0.25);
    --correct: #34d399; --correct-bg: rgba(52,211,153,0.15);
    --wrong: #f87171; --wrong-bg: rgba(248,113,113,0.15);
    --opt0: #e74c3c; --opt1: #3498db; --opt2: #f1c40f; --opt3: #2ecc71;
  }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .screen { display: none; width: 100%; max-width: 400px; text-align: center; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  .brand { font-size: 2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 24px;
    background: linear-gradient(135deg, #faf7ff 0%, #b48cff 45%, #7c5cfc 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  /* Join */
  .join-form { width: 100%; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; text-align: left; font-size: 0.85rem; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .input-group input { width: 100%; padding: 16px; background: var(--surface); border: 2px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 1.2rem; font-weight: 600; text-align: center;
    font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
  .input-group input:focus { border-color: var(--accent); }
  .input-group input::placeholder { color: var(--text-secondary); font-weight: 400; }
  .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 18px;
    border-radius: 14px; font-size: 1.15rem; font-weight: 700; cursor: pointer;
    transition: transform 0.15s; font-family: 'Inter', sans-serif; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; }
  .error-msg { color: var(--wrong); font-size: 0.9rem; font-weight: 600; margin-top: 12px; min-height: 1.2em; }

  /* Waiting */
  .waiting-text { font-size: 1.1rem; color: var(--text-secondary); margin-top: 16px; }
  .player-name-display { font-size: 2rem; font-weight: 800; color: var(--accent); margin: 16px 0; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* Answer buttons - Kahoot style full screen colored */
  .answer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; flex: 1; }
  .answer-btn { border: none; border-radius: 14px; padding: 24px 12px; font-size: 1.1rem;
    font-weight: 700; color: white; cursor: pointer; transition: transform 0.15s, opacity 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 80px;
    font-family: 'Inter', sans-serif; }
  .answer-btn:active { transform: scale(0.95); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn:nth-child(1) { background: var(--opt0); }
  .answer-btn:nth-child(2) { background: var(--opt1); }
  .answer-btn:nth-child(3) { background: var(--opt2); color: #1a1a24; }
  .answer-btn:nth-child(4) { background: var(--opt3); }
  .answer-btn.dim { opacity: 0.2; }
  .answer-btn.selected { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.3); }

  .q-info { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }

  /* Result */
  .result-icon { font-size: 4rem; margin-bottom: 12px; }
  .result-text { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
  .result-points { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 4px; }
  .result-score { font-size: 2rem; font-weight: 900; color: var(--accent); margin: 12px 0; }
  .result-streak { font-size: 0.9rem; color: var(--text-secondary); }
  .result-correct { color: var(--correct); }
  .result-wrong { color: var(--wrong); }

  /* End */
  .end-rank { font-size: 5rem; font-weight: 900; color: var(--accent); margin: 16px 0; }
  .end-score { font-size: 1.2rem; color: var(--text-secondary); }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="brand">Recuerdoot</div>
  <div class="join-form">
    <div class="input-group">
      <label>PIN de la partida</label>
      <input type="tel" id="pin-input" placeholder="000000" maxlength="6" inputmode="numeric">
    </div>
    <div class="input-group">
      <label>Tu nombre</label>
      <input type="text" id="name-input" placeholder="Nombre" maxlength="15">
    </div>
    <button class="btn" id="btn-join" onclick="joinGame()">Unirse</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<!-- WAITING IN LOBBY -->
<div id="waiting-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div class="player-name-display" id="my-name"></div>
  <div class="waiting-text pulse">Esperando a que el host empiece...</div>
</div>

<!-- ANSWERING -->
<div id="answer-screen" class="screen">
  <div class="q-info" id="p-q-info">Pregunta 1 / 22</div>
  <div class="answer-grid" id="answer-grid"></div>
</div>

<!-- LISTENING (pre-phase for audio questions) -->
<div id="listen-screen" class="screen">
  <div class="q-info" id="listen-q-info">Pregunta 1 / 22</div>
  <div style="font-size:3rem; margin:24px 0;">&#127911;</div>
  <div class="waiting-text pulse">Mira la pantalla y escucha...</div>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-text" id="result-text"></div>
  <div class="result-points" id="result-points"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-streak" id="result-streak"></div>
  <div class="waiting-text pulse" style="margin-top:24px;">Esperando siguiente pregunta...</div>
</div>

<!-- GAME OVER -->
<div id="end-screen" class="screen">
  <div class="brand">Recuerdoot</div>
  <div class="end-rank" id="end-rank"></div>
  <div class="result-text" id="end-position"></div>
  <div class="end-score" id="end-score"></div>
  <button class="btn" style="margin-top:32px;" onclick="location.reload()">Volver</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = "";
let answered = false;

const shapes = [
  `<svg viewBox="0 0 24 24" width="24" height="24"><polygon points="12,2 2,22 22,22" fill="currentColor"/></svg>`,
  `<svg viewBox="0 0 24 24" width="24" height="24"><rect x="2" y="2" width="20" height="20" rx="3" fill="currentColor"/></svg>`,
  `<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>`,
  `<svg viewBox="0 0 24 24" width="24" height="24"><polygon points="12,2 22,12 12,22 2,12" fill="currentColor"/></svg>`,
];

function joinGame() {
  const pin = document.getElementById("pin-input").value.trim();
  const name = document.getElementById("name-input").value.trim();
  document.getElementById("error-msg").textContent = "";
  if (!pin || pin.length < 4) { document.getElementById("error-msg").textContent = "Introduce un PIN"; return; }
  if (!name) { document.getElementById("error-msg").textContent = "Introduce tu nombre"; return; }
  document.getElementById("btn-join").disabled = true;
  socket.emit("player:join", { pin, name });
}

socket.on("player:error", (msg) => {
  document.getElementById("error-msg").textContent = msg;
  document.getElementById("btn-join").disabled = false;
});

socket.on("player:joined", ({ name }) => {
  myName = name;
  document.getElementById("my-name").textContent = name;
  showScreen("waiting-screen");
});

socket.on("player:wait", (data) => {
  showScreen("listen-screen");
  document.getElementById("listen-q-info").textContent = `Pregunta ${data.index + 1} / ${data.total}`;
});

socket.on("player:question", (data) => {
  answered = false;
  showScreen("answer-screen");
  document.getElementById("p-q-info").textContent = `Pregunta ${data.index + 1} / ${data.total}`;
  const grid = document.getElementById("answer-grid");
  grid.innerHTML = data.options.map((opt, i) =>
    `<button class="answer-btn" data-answer="${esc(opt)}" onclick="sendAnswer(this)">${shapes[i]} ${esc(opt)}</button>`
  ).join("");
});

function sendAnswer(btn) {
  if (answered) return;
  answered = true;
  const answer = btn.dataset.answer;
  socket.emit("player:answer", { answer });

  // Visual feedback
  document.querySelectorAll(".answer-btn").forEach(b => {
    b.disabled = true;
    if (b !== btn) b.classList.add("dim");
    else b.classList.add("selected");
  });
}

socket.on("player:result", ({ isCorrect, points, score, streak, timeout }) => {
  showScreen("result-screen");
  if (timeout) {
    document.getElementById("result-icon").textContent = "\u23F0";
    document.getElementById("result-text").textContent = "Se acabo el tiempo";
    document.getElementById("result-text").className = "result-text result-wrong";
    document.getElementById("result-points").textContent = "";
  } else if (isCorrect) {
    document.getElementById("result-icon").textContent = "\u2705";
    document.getElementById("result-text").textContent = "\u00A1Correcto!";
    document.getElementById("result-text").className = "result-text result-correct";
    document.getElementById("result-points").textContent = `+${points} puntos`;
  } else {
    document.getElementById("result-icon").textContent = "\u274C";
    document.getElementById("result-text").textContent = "Incorrecto";
    document.getElementById("result-text").className = "result-text result-wrong";
    document.getElementById("result-points").textContent = "";
  }
  document.getElementById("result-score").textContent = `${score} pts`;
  if (streak > 1) {
    document.getElementById("result-streak").textContent = `\uD83D\uDD25 Racha de ${streak}`;
  } else {
    document.getElementById("result-streak").textContent = "";
  }
});

socket.on("game:end", ({ leaderboard }) => {
  showScreen("end-screen");
  const myIdx = leaderboard.findIndex(p => p.name === myName);
  const rank = myIdx + 1;
  const medals = ["", "\uD83E\uDD47", "\uD83E\uDD48", "\uD83E\uDD49"];
  document.getElementById("end-rank").textContent = medals[rank] || `#${rank}`;
  document.getElementById("end-position").textContent = rank === 1 ? "\u00A1Has ganado!" : `Puesto ${rank}`;
  document.getElementById("end-score").textContent = myIdx >= 0 ? `${leaderboard[myIdx].score} puntos` : "";
});

socket.on("player:gameOver", (msg) => {
  showScreen("end-screen");
  document.getElementById("end-rank").textContent = "";
  document.getElementById("end-position").textContent = msg;
  document.getElementById("end-score").textContent = "";
});

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// Auto-focus PIN input
document.getElementById("pin-input").focus();

// Allow Enter to submit
document.querySelectorAll("#join-screen input").forEach(inp => {
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") joinGame(); });
});
</script>
</body>
</html>
